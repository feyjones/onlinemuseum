<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Museum Walkthrough</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #050505;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    /* UI Overlay Elements */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .header-panel {
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(8px);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      align-self: center;
      text-align: center;
    }

    .header-panel h1 {
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e0e0e0;
    }

    .header-panel p {
      font-size: 0.8rem;
      color: #a0a0a0;
      margin-top: 4px;
    }

    /* On-Screen Arrow Controls */
    #controls-container {
      pointer-events: auto;
      align-self: flex-start;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 8px;
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(8px);
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .arrow-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .arrow-btn:active, .arrow-btn.active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }

    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    /* Crosshair in center for focus */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>

  <!-- Include Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div class="header-panel">
      <h1 id="location-name">Main Lobby</h1>
      <p>Click & Drag mouse to Look/Walk • Arrow Keys or Screen Controls to Navigate</p>
    </div>

    <div class="crosshair"></div>

    <!-- On-screen Navigation Controls -->
    <div id="controls-container">
      <button class="arrow-btn" id="btn-up">▲</button>
      <button class="arrow-btn" id="btn-left">◄</button>
      <button class="arrow-btn" id="btn-down">▼</button>
      <button class="arrow-btn" id="btn-right">►</button>
    </div>
  </div>

  <script>
    // --- CONFIGURATION & ARTWORK DATA ---
    // Replace the 'url' values below with your real image paths or web links when ready!
    const galleryData = [
      // Lobby Artworks
      { id: 'lobby_1', room: 'Lobby', position: [0, 2.5, -9.8], rotation: [0, 0, 0], title: "Lobby Piece 1", url: null },
      { id: 'lobby_2', room: 'Lobby', position: [-9.8, 2.5, 0], rotation: [0, Math.PI / 2, 0], title: "Lobby Piece 2", url: null },
      
      // North Room (Room 1)
      { id: 'r1_1', room: 'Gallery 1 (North)', position: [0, 2.5, -34.8], rotation: [0, 0, 0], title: "North Exhibit A", url: null },
      { id: 'r1_2', room: 'Gallery 1 (North)', position: [-7.3, 2.5, -27], rotation: [0, Math.PI / 2, 0], title: "North Exhibit B", url: null },
      { id: 'r1_3', room: 'Gallery 1 (North)', position: [7.3, 2.5, -27], rotation: [0, -Math.PI / 2, 0], title: "North Exhibit C", url: null },

      // South Room (Room 2)
      { id: 'r2_1', room: 'Gallery 2 (South)', position: [0, 2.5, 34.8], rotation: [0, Math.PI, 0], title: "South Exhibit A", url: null },
      { id: 'r2_2', room: 'Gallery 2 (South)', position: [-7.3, 2.5, 27], rotation: [0, Math.PI / 2, 0], title: "South Exhibit B", url: null },
      { id: 'r2_3', room: 'Gallery 2 (South)', position: [7.3, 2.5, 27], rotation: [0, -Math.PI / 2, 0], title: "South Exhibit C", url: null },

      // East Room (Room 3)
      { id: 'r3_1', room: 'Gallery 3 (East)', position: [34.8, 2.5, 0], rotation: [0, -Math.PI / 2, 0], title: "East Exhibit A", url: null },
      { id: 'r3_2', room: 'Gallery 3 (East)', position: [27, 2.5, -7.3], rotation: [0, 0, 0], title: "East Exhibit B", url: null },
      { id: 'r3_3', room: 'Gallery 3 (East)', position: [27, 2.5, 7.3], rotation: [0, Math.PI, 0], title: "East Exhibit C", url: null },

      // West Room (Room 4)
      { id: 'r4_1', room: 'Gallery 4 (West)', position: [-34.8, 2.5, 0], rotation: [0, Math.PI / 2, 0], title: "West Exhibit A", url: null },
      { id: 'r4_2', room: 'Gallery 4 (West)', position: [-27, 2.5, -7.3], rotation: [0, 0, 0], title: "West Exhibit B", url: null },
      { id: 'r4_3', room: 'Gallery 4 (West)', position: [-27, 2.5, 7.3], rotation: [0, Math.PI, 0], title: "West Exhibit C", url: null }
    ];

    // --- THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);
    scene.fog = new THREE.FogExp2(0x0a0a0f, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 0); // Eye level height (1.7m)

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const mainLight = new THREE.PointLight(0xffeedd, 0.8, 20);
    mainLight.position.set(0, 5, 0);
    scene.add(mainLight);

    // --- MATERIALS ---
    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x1f1f24, roughness: 0.8 });
    const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.4, metalness: 0.2 });
    const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x332211, roughness: 0.5 });

    // --- HELPER: TEXTURE PLACEHOLDER GENERATOR ---
    function createPlaceholderTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 384;
      const ctx = canvas.getContext('2d');

      // Background gradient
      const grad = ctx.createLinearGradient(0, 0, 512, 384);
      grad.addColorStop(0, '#2a2a35');
      grad.addColorStop(1, '#15151d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 384);

      // Decorative border
      ctx.strokeStyle = '#444455';
      ctx.lineWidth = 10;
      ctx.strokeRect(15, 15, 482, 354);

      // Text
      ctx.fillStyle = '#b0b0c0';
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("This painting will be here soon", 256, 170);

      ctx.fillStyle = '#777788';
      ctx.font = 'italic 16px sans-serif';
      ctx.fillText(`[ ${text} ]`, 256, 210);

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    // --- BUILD ARCHITECTURE ---
    function buildRoom(x, z, width, depth) {
      // Floor
      const floorGeo = new THREE.PlaneGeometry(width, depth);
      const floor = new THREE.Mesh(floorGeo, floorMaterial);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(x, 0, z);
      scene.add(floor);

      // Ceiling
      const ceiling = new THREE.Mesh(floorGeo, wallMaterial);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.set(x, 6, z);
      scene.add(ceiling);

      // Local Room Spotlight
      const light = new THREE.PointLight(0xfff5ea, 0.6, Math.max(width, depth) * 1.2);
      light.position.set(x, 5.5, z);
      scene.add(light);
    }

    function createWall(x, z, width, height, rotationY) {
      const wallGeo = new THREE.PlaneGeometry(width, height);
      const wall = new THREE.Mesh(wallGeo, wallMaterial);
      wall.position.set(x, height / 2, z);
      wall.rotation.y = rotationY;
      scene.add(wall);
    }

    // 1. Main Lobby (Center)
    buildRoom(0, 0, 20, 20);
    // 2. North Room
    buildRoom(0, -27, 15, 15);
    // 3. South Room
    buildRoom(0, 27, 15, 15);
    // 4. East Room
    buildRoom(27, 0, 15, 15);
    // 5. West Room
    buildRoom(-27, 0, 15, 15);

    // Corridors connecting Lobby to Rooms
    buildRoom(0, -14.5, 6, 9);  // North Corridor
    buildRoom(0, 14.5, 6, 9);   // South Corridor
    buildRoom(14.5, 0, 9, 6);   // East Corridor
    buildRoom(-14.5, 0, 9, 6);  // West Corridor

    // Wall Structures (Outer Boundary Walls)
    createWall(0, -34.5, 15, 6, 0);                 // North Room Far Wall
    createWall(-7.5, -27, 15, 6, Math.PI / 2);      // North Room Left Wall
    createWall(7.5, -27, 15, 6, -Math.PI / 2);     // North Room Right Wall

    createWall(0, 34.5, 15, 6, Math.PI);            // South Room Far Wall
    createWall(-7.5, 27, 15, 6, Math.PI / 2);       // South Room Left Wall
    createWall(7.5, 27, 15, 6, -Math.PI / 2);      // South Room Right Wall

    createWall(34.5, 0, 15, 6, -Math.PI / 2);       // East Room Far Wall
    createWall(27, -7.5, 15, 6, 0);                 // East Room Left Wall
    createWall(27, 7.5, 15, 6, Math.PI);            // East Room Right Wall

    createWall(-34.5, 0, 15, 6, Math.PI / 2);       // West Room Far Wall
    createWall(-27, -7.5, 15, 6, 0);                // West Room Left Wall
    createWall(-27, 7.5, 15, 6, Math.PI);           // West Room Right Wall

    // --- POPULATE ARTWORKS ---
    galleryData.forEach(item => {
      // Frame
      const frameGeo = new THREE.BoxGeometry(3.2, 2.4, 0.1);
      const frame = new THREE.Mesh(frameGeo, frameMaterial);
      frame.position.set(...item.position);
      frame.rotation.set(...item.rotation);

      // Artwork Plane
      const artGeo = new THREE.PlaneGeometry(3.0, 2.2);
      let artMaterial;

      if (item.url) {
        const texture = new THREE.TextureLoader().load(item.url);
        artMaterial = new THREE.MeshBasicMaterial({ map: texture });
      } else {
        const placeholder = createPlaceholderTexture(item.title);
        artMaterial = new THREE.MeshBasicMaterial({ map: placeholder });
      }

      const art = new THREE.Mesh(artGeo, artMaterial);
      art.position.z = 0.06; // Slightly in front of frame frame box
      frame.add(art);

      // Dedicated Frame Spotlight
      const spot = new THREE.SpotLight(0xfffaed, 1, 8, Math.PI / 5, 0.5);
      spot.position.set(item.position[0], item.position[1] + 2, item.position[2]);
      spot.target = frame;
      scene.add(spot);

      scene.add(frame);
    });

    // --- CONTROLS & MOVEMENT STATE ---
    let isMouseDown = false;
    let previousMousePosition = { x: 0, y: 0 };
    let yaw = 0;
    let pitch = 0;

    const keyState = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    const moveSpeed = 0.12;
    const rotateSpeed = 0.003;

    // Mouse Controls (Look around & Hold LMB to Walk Forward)
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#controls-container')) return; // Ignore on UI buttons
      if (e.button === 0) { // Left mouse button
        isMouseDown = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;

      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;

      yaw -= deltaX * rotateSpeed;
      pitch -= deltaY * rotateSpeed;

      // Pitch clamp to avoid flipping overhead
      pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    // Keyboard Arrow Controls
    window.addEventListener('keydown', (e) => {
      if (keyState.hasOwnProperty(e.key)) keyState[e.key] = true;
    });

    window.addEventListener('keyup', (e) => {
      if (keyState.hasOwnProperty(e.key)) keyState[e.key] = false;
    });

    // On-Screen Arrow Buttons (Touch/Click)
    function setupButtonControl(btnId, keyName) {
      const btn = document.getElementById(btnId);
      const start = (e) => { e.preventDefault(); keyState[keyName] = true; btn.classList.add('active'); };
      const end = (e) => { e.preventDefault(); keyState[keyName] = false; btn.classList.remove('active'); };

      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
    }

    setupButtonControl('btn-up', 'ArrowUp');
    setupButtonControl('btn-down', 'ArrowDown');
    setupButtonControl('btn-left', 'ArrowLeft');
    setupButtonControl('btn-right', 'ArrowRight');

    // --- MAIN ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Apply Rotation to Camera (Euler YXZ order for FPS view)
      const euler = new THREE.Euler(0, 0, 0, 'YXZ');
      euler.x = pitch;
      euler.y = yaw;
      camera.quaternion.setFromEuler(euler);

      // Direction Vectors
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      forward.y = 0; // Lock movement on floor plane
      forward.normalize();

      const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
      side.y = 0;
      side.normalize();

      // Process Movement Inputs
      // 1. Move forward continuous while Left Mouse Button is down
      if (isMouseDown) {
        camera.position.addScaledVector(forward, moveSpeed * 0.75);
      }

      // 2. Keyboard / On-Screen Arrow movements
      if (keyState.ArrowUp) camera.position.addScaledVector(forward, moveSpeed);
      if (keyState.ArrowDown) camera.position.addScaledVector(forward, -moveSpeed);
      if (keyState.ArrowLeft) camera.position.addScaledVector(side, -moveSpeed);
      if (keyState.ArrowRight) camera.position.addScaledVector(side, moveSpeed);

      // Simple Room Boundary Clamping (Soft Collisions)
      camera.position.x = Math.max(-33, Math.min(33, camera.position.x));
      camera.position.z = Math.max(-33, Math.min(33, camera.position.z));
      camera.position.y = 1.7; // Keep fixed eye height

      // Dynamic Location Header Text based on position
      const locHeader = document.getElementById('location-name');
      const z = camera.position.z;
      const x = camera.position.x;

      if (z < -18) locHeader.innerText = "Gallery 1 — North Wing";
      else if (z > 18) locHeader.innerText = "Gallery 2 — South Wing";
      else if (x > 18) locHeader.innerText = "Gallery 3 — East Wing";
      else if (x < -18) locHeader.innerText = "Gallery 4 — West Wing";
      else locHeader.innerText = "Main Lobby";

      renderer.render(scene, camera);
    }

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start loop
    animate();
  </script>
</body>
</html>
